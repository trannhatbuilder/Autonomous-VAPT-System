# VAPT-AI MCP Tool Wrapper — whatweb
# ============================================================
# Tool: whatweb (Web tech fingerprint)
# Category: recon
# WSTG IDs: WSTG-INFO-04 (Search Engine Discovery), WSTG-CONF-01 (Network Configuration)
# MITRE ATT&CK: T1592.002 (Gather Victim Host Info: Software)
# Install: apt install whatweb (W1-I)
# ============================================================

name: whatweb
command: whatweb
enabled: true
description: |
  Web tech fingerprint tool. Identifies CMS, frameworks, JS libraries,
  web servers, analytics packages, etc. 1800+ plugins.

  Examples:
    - Fingerprint single URL:  whatweb http://example.com
    - Multiple targets:        whatweb -i urls.txt
    - Aggressive:              whatweb -a 3 http://example.com
    - JSON output:             whatweb --output-format json http://example.com

  NOTE: Aggression 3+ sends many requests and may trigger WAF/challenge
  blocks. Prefer -a 1 for the first pass; escalate only if needed.
  If output is empty, the target may be behind a WAF/challenge page —
  report the limitation instead of concluding the site is down.

short_description: Web tech fingerprint (1800+ plugins)

category: recon

wstg_ids:
  - WSTG-INFO-04  # Search Engine Discovery
  - WSTG-CONF-01  # Network Configuration
mitre_attack:
  - T1592.002  # Software

safety_class: active

parameters:
  - name: target
    type: string
    description: Target URL (e.g. http://example.com)
    required: true
    position: 1
    default: ""

  # FIX: added — probe multiple hosts from a file in one call
  - name: list
    type: string
    description: File with list of URLs/hosts (one per line)
    required: false
    flag: "-i"
    default: ""

  - name: aggression
    type: integer
    description: |
      Aggression level (1=stealthy, 3=aggressive — sends more requests,
      higher WAF-trigger risk). Default 1.
    required: false
    flag: "-a"
    default: 1
    options: [1, 2, 3, 4]

  # FIX: was flag "--output-json" which DOES NOT EXIST in whatweb.
  # Correct syntax: --output-format <format> (or -o <format>).
  - name: output_format
    type: string
    description: Output format (brief, verbose, json, xml, ndjson)
    required: false
    flag: "--output-format"
    default: ""
    options: [brief, verbose, json, xml, ndjson]

  - name: no_errors
    type: bool
    description: Suppress error messages
    required: false
    flag: "--no-errors"
    default: false   # FIX: was true — suppressing errors hides WHY a scan
                     # returned empty. Errors must reach the agent's context.

  # REMOVED: `quiet` (-q) parameter.
  # whatweb's -q/--quiet suppresses ALL console output (results included) —
  # it is designed for use with --log-* file output, not for clean stdout.
  # With default: true it was appended on EVERY call, so every scan returned
  # 0 bytes and the orchestrator showed [empty_result]. The version banner is
  # small and harmless, so its only purpose was to hide the results we want.
  # Deleting the parameter (rather than defaulting it to false) guarantees the
  # LLM can never set it. Need banner suppression? Use additional_args.

  - name: max_threads
    type: integer
    description: Max concurrent threads (lower = gentler on target)
    required: false
    flag: "--max-threads"
    default: 10

  - name: user_agent
    type: string
    description: Custom User-Agent string
    required: false
    flag: "--user-agent"
    default: ""

  - name: additional_args
    type: string
    description: |
      Additional whatweb arguments. WARNING: bypasses parameter validation.
      Do not use to override safety defaults.
    required: false
    default: ""

output:
  max_bytes: 50000
  format: text
  # FIX: single-escaped regex — YAML single-quoted strings do not need
  # backslash escaping. Double-escaping (\\[) breaks matching if the
  # wrapper compiles the string as-is.
  parse_hints:
    tech: '\[([^\]]+)\]'
    challenge_page: 'One moment|challenge|cf-edge|captcha'

timeout: 120
allowed_exit_codes: [0]
# NOTE: whatweb may exit non-zero if the target is unreachable;
# the orchestrator should still surface stderr in that case rather
# than treating it as a silent failure.