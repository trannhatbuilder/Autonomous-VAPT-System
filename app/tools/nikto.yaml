# VAPT-AI MCP Tool Wrapper — nikto
# ============================================================
# Tool: nikto (Web server scanner)
# Category: vuln_scanner
# WSTG IDs: WSTG-CONF-01 (Network Configuration), WSTG-CONF-06 (Test HTTP Methods)
# MITRE ATT&CK: T1595.002 (Active Scanning: Vulnerability Scanning)
# Install: apt install nikto (W1-I)   # 2.1.5 — consider upgrading to 2.5.x
# ============================================================

name: nikto
command: nikto
enabled: true
description: |
  Web server scanner — checks for 6700+ potentially dangerous files/programs,
  outdated server software, misconfigurations. Slower than nuclei but thorough.

  Examples:
    - Basic scan:     nikto -h <host>
    - With port:      nikto -h <host> -p 8080
    - Bounded scan:   nikto -h <host> -p 443 -maxtime 4m

  NOTES:
    - Pass the BARE host (or host:port). NEVER pass -ssl: on this install it
      forces an HTTPS-only probe that returns nothing, so nikto aborts with
      "No web server found on <host>:<port>" / "0 host(s) tested". Nikto probes
      HTTP first and falls back to HTTPS by itself. Do NOT rely on a `https://`
      URL scheme to enable TLS either — nikto 2.1.5 only extracts host/port
      from the URL and still probes HTTP.
    - Results are printed to stdout — use them directly as evidence.
      There is intentionally NO file-format parameter (see `format` removal
      note below). Do NOT pass -Format via additional_args without an
      -output file — nikto crashes with "Unable to open '' for write".
    - -maxtime bounds the scan (partial results returned). COSMETIC QUIRK:
      nikto 2.1.5 also prints a spurious "+ ERROR: Host maximum execution time
      of N seconds reached" line immediately after start (its
      $mark->{start_time} is still unset at the first request, and the check
      only sets terminate=1). Treat that line as informational, not fatal.
    - On WAF/challenge-fronted targets (Cloudflare etc.), nikto sees the
      challenge/400 page only — findings may not reflect the origin server.
      Note this limitation in the report.

short_description: Web server scanner (6700+ checks)

category: vuln_scanner

wstg_ids:
  - WSTG-CONF-01
  - WSTG-CONF-06
mitre_attack:
  - T1595.002

safety_class: active

parameters:
  - name: target
    type: string
    description: |
      Target host (prefer a BARE hostname or IP, e.g. example.com, or
      host:port). Do not pass -ssl, and do not expect an https:// scheme to
      enable TLS — nikto 2.1.5 probes HTTP then HTTPS on its own.
    required: true
    flag: "-h"

  - name: port
    type: integer
    description: 'Target port (default: 80 for http, 443 for https)'
    required: false
    flag: "-p"
    default: 0

  # REMOVED (W23): `-ssl` param DELETED.
  # Empirically VERIFIED on nikto 2.1.5 in this install: passing -ssl forces the
  # HTTPS-only probe path and the probe returns an EMPTY response, so nikto
  # aborts the host with "No web server found on <host>:<port>" and
  # "0 host(s) tested" — the scan never runs. Reproduced on emcer.in:443 WITH and
  # WITHOUT -maxtime (so it is NOT a maxtime interaction).
  #   * Source: nikto_core.plugin builds @checktypes = ('HTTP','HTTPS'); -ssl does
  #     shift(@checktypes), removing the HTTP-first probe that otherwise succeeds
  #     against port-443 listeners. The remaining HTTPS probe yields nothing here.
  #   * Socket-level TLS to the same host works fine (openssl s_client succeeds
  #     with AND without SNI, IO::Socket::SSL 2.098 + Net::SSLeay 1.94 installed),
  #     so the failure is inside nikto's HTTPS request path, not the TLS stack.
  #   * The `https://` URL scheme does NOT set -ssl either (nikto_core.plugin
  #     uri_split only extracts host/port), so `-h https://host` still probes HTTP.
  # => A param whose flag can only ever break the scan is worse than no param
  #    (same rationale as the removed `format` and `useragent` params). Nikto
  #    probes HTTP first and falls back to HTTPS by itself; no flag needed.

  - name: tuning
    type: string
    description: |
      Tuning options (1=Interesting File, 3=Injection, 8=SQLi, etc.).
      Pass a subset (e.g. "1,2b") for faster targeted scans.
    required: false
    flag: "-Tuning"
    default: ""

  # FIX: `format` param REMOVED ENTIRELY. Rationale: nikto's report plugin
  # dies ("Unable to open '' for write") whenever -Format is passed without
  # -output, and loader.py has no cross-parameter validation to enforce
  # "format requires output". File output adds nothing for an agent loop —
  # stdout text IS the evidence. Removing the parameter removes the crash
  # class completely (defense by absence, not by instruction).
  #
  # If file output is ever needed, re-add BOTH params together and enforce
  # the pairing inside build_command_args (loader.py), not in YAML comments.

  # FIX: added — bounds TOTAL scan time (LLM previously hacked this via
  # additional_args "-maxtime 120s"). Auto-terminates with partial results.
  - name: max_time
    type: string
    description: |
      Maximum total scan time (e.g. "4m", "120s", "60s"). ALWAYS set for
      automation — without it a full nikto scan can exceed the 300s
      hard timeout and be killed with no results.
    required: false
    flag: "-maxtime"
    default: "4m"
    duration: true   # bare numbers get "s" appended (requires loader.py duration field)

  # FIX: added — CRITICAL anti-hang guard. Without -nointeractive, nikto
  # may pause and WAIT FOR STDIN on certain checks ("...check? y/n"),
  # stalling the subprocess until the hard timeout kills it.
  - name: no_interactive
    type: bool
    description: Never prompt for input (required for automation)
    required: false
    flag: "-nointeractive"
    default: true
    locked: true     # informational — agent should not override

  # VERIFIED on nikto 2.1.5 (/usr/bin/nikto): `-ask` IS a valid option —
  #   * source: nikto_core.plugin GetOptions("ask=s" => ...)  (values yes/no/auto)
  #   * `nikto -ask` (no value) errors "Option ask requires an argument"
  #     (recognised), vs `-bogusflag` -> "Unknown option: bogusflag"
  #   * `nikto -ask=no` runs clean. => KEPT. (`-ask=no` = don't ask, don't send
  #     update data to CIRT.net.) It is NOT a newer-only flag.
  - name: ask_no
    type: bool
    description: Answer 'no' to all nikto questions (required for automation)
    required: false
    flag: "-ask=no"
    default: true
    locked: true

  - name: timeout
    type: integer
    description: Per-request timeout in seconds (raise to 20+ for slow/WAF targets)
    required: false
    flag: "-timeout"
    default: 20

  # REMOVED (W20): `-useragent` is NOT a valid nikto 2.1.5 flag — the binary
  #   errors `Unknown option: useragent`. In 2.1.5 the User-Agent is config-only
  #   (USERAGENT= in /etc/nikto/config.txt; the core plugin reads
  #   $CONFIGFILE{'USERAGENT'} and there is no CLI override). A param whose flag
  #   can only ever fail is worse than no param (same rationale as `format`).
  #   If a future nikto adds a UA flag, re-add it — verify with `nikto -H` first.

  - name: additional_args
    type: string
    description: |
      Additional nikto arguments. WARNING: never pass -Format here without
      -output <file> — nikto crashes with "Unable to open '' for write".
    required: false
    default: ""

output:
  max_bytes: 50000
  format: text
  parse_hints:
    finding: '^\+\s+(.*)'
    osvdb: 'OSVDB-(\d+)'

# max_time (4m) fires first with partial results; this is the backstop.
timeout: 300
allowed_exit_codes: [0, 1, 2]
# 0 = clean, 1 = found issues (nikto's convention varies by version),
# 2 = invocation/plugin error — allowed so stderr reaches the agent
# instead of being masked as a hard failure.