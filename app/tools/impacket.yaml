name: impacket
command: impacket-smbexec
enabled: true
description: |
  Impacket — Python collection of network protocol classes for exploitation.
  Includes smbexec, psexec, wmiexec, secretsdump, GetUserSPNs, etc.

  NOTE: This YAML defaults to the `impacket-smbexec` subtool. If you need
  a different subtool (e.g. secretsdump), use the `additional_args` field
  to pass the full command — the LLM should know to NOT pass `subtool`
  since the command is hardcoded to impacket-smbexec.

  Examples:
    - smbexec: impacket-smbexec user:pass@10.0.0.5
    - secretsdump: impacket-secretsdump user:pass@10.0.0.5
    - GetUserSPNs: impacket-GetUserSPNs domain.local/user:pass -request
short_description: Impacket — SMB/WMI/Kerberos exploitation toolkit
category: exploitation
wstg_ids:
  - WSTG-ATHN-04
  - WSTG-ATHZ-03
mitre_attack:
  - T1021
  - T1558
safety_class: destructive
parameters:
  - name: target
    type: string
    description: Target (user:pass@host or domain/user:pass@host)
    required: true
    position: 1
  - name: additional_args
    type: string
    description: |
      Additional impacket arguments (e.g. "-no-pass -k" for Kerberos auth).
      Note: to switch subtool from smbexec to e.g. secretsdump, you must
      invoke a different command — use the `impacket-secretsdump` tool
      definition (if registered) OR fall back to a generic exec tool.
    required: false
    default: ""
output:
  max_bytes: 50000
  format: text
timeout: 300
allowed_exit_codes: [0, 1]