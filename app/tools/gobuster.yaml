# VAPT-AI MCP Tool Wrapper — gobuster
# ============================================================
# Tool: gobuster (Directory/file brute-force)
# Category: web_scanner
# WSTG IDs: WSTG-CONF-05 (Review Old Backup and Unreferenced Files), WSTG-ATHZ-01 (Directory Traversal)
# MITRE ATT&CK: T1595.003 (Wordlist Scanning)
# Install: apt install gobuster (W1-I)
# ============================================================

name: gobuster
command: gobuster
enabled: true
description: |
  Directory/file brute-force tool. Discovers hidden paths using wordlists.

  Examples:
    - Directory scan: gobuster dir -u <url> -w wordlist.txt
    - Subdomain scan: gobuster dns -d example.com -w subdomains.txt
    - vhost scan: gobuster vhost -u <url> -w vhosts.txt

short_description: Directory/file brute-force scanner

category: web_scanner

wstg_ids:
  - WSTG-CONF-05  # Old Backup and Unreferenced Files
  - WSTG-ATHZ-01  # Directory Traversal
mitre_attack:
  - T1595.003  # Wordlist Scanning

safety_class: active

parameters:
  - name: mode
    type: string
    description: |
      Scan mode. "dir" = directory/file brute-force (default), "vhost" =
      virtual-host discovery, "fuzz" = FUZZ-keyword fuzzing.
      NOTE: gobuster's DNS mode is intentionally NOT exposed — it takes
      `--domain` instead of `-u`, which this single-target wrapper can't
      route. Use the `subfinder` tool for DNS subdomain enumeration.
    required: true
    position: 1
    default: "dir"
    options: ["dir", "vhost", "fuzz"]

  - name: target
    type: string
    description: "Target URL (required for every supported mode - dir, vhost, fuzz)"
    required: true
    flag: "-u"

  - name: wordlist
    type: string
    description: |
      Path to wordlist file. W19-FIX3-F3: default medium wordlist (NOT large)
      — balances coverage vs scan time. Override with directory-list-2.3-big
      or directory-list-2.3-large for deeper enumeration when explicitly needed.
    required: false
    flag: "-w"
    default: "/usr/share/wordlists/dirb/directory-list-2.3-medium.txt"

  - name: extensions
    type: string
    description: File extensions to search (comma-separated, e.g. php,asp,jsp)
    required: false
    flag: "-x"
    default: ""

  - name: status_codes
    type: string
    description: 'Status codes to include (default: 200,204,301,302,307,401,403)'
    required: false
    flag: "-s"
    default: ""

  - name: threads
    type: integer
    description: |
      Number of concurrent threads. Default 25 (W19-FIX: lowered from 50) —
      gentler on Cloudflare-fronted / rate-limiting targets to avoid bans and
      false negatives. Raise explicitly for internal/robust hosts.
    required: false
    flag: "-t"
    default: 25

  - name: timeout
    type: string
    description: |
      HTTP timeout in Go duration format — MUST include the unit:
      "10s", "30s", "2m". A bare number like 15 causes a parse error.
    required: false
    flag: "--to"
    default: "10s"
    duration: true   # loader.py appends "s" if the LLM sends a bare number (15 -> 15s)
    options: ["5s", "10s", "15s", "30s"]   # enum gợi ý cho LLM

  - name: quiet
    type: bool
    description: Suppress the banner (results are still printed)
    required: false
    flag: "-q"
    default: true

  - name: no_progress
    type: bool
    description: Hide the progress bar/updates (cleaner output for automation)
    required: false
    flag: "--np"
    default: true

  - name: additional_args
    type: string
    description: Additional gobuster arguments
    required: false
    default: ""

output:
  max_bytes: 50000
  format: text
  parse_hints:
    found: '(\S+)\s+\(Status:\s+(\d+)\)\s+\[Size:\s+(\d+)\]'

timeout: 600
# VERIFIED against gobuster 3.8.2 (/usr/bin/gobuster):
#   0 = success, INCLUDING zero results found (exit stays 0)
#   1 = REAL error — connection refused / unreachable host, missing wordlist
#   3 = invalid mode / bad usage ("No help topic")
# Only 0 is a successful scan; 1 and 3 must surface as failures.
allowed_exit_codes: [0]
