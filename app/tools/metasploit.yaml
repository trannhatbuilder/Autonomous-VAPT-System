name: metasploit
command: msfconsole
enabled: true
description: |
  Metasploit Framework — exploit execution via non-interactive msfconsole.

  ⚠ NO HUMAN GATE: exploits RUN IMMEDIATELY when called. Use only for
  confirmed vulnerabilities within the authorized target, and prefer
  non-destructive proof (auxiliary/scanner modules, version checks).
  For most vulnerabilities, sqlmap/nuclei output is sufficient PoC —
  reach for metasploit only when lighter tools cannot prove impact.

  Workflow per module:
    msfconsole -q -x "use auxiliary/scanner/http/http_version; set RHOSTS <target>; run"

  Output markers: "session opened" = successful exploitation;
  "[-] Exploit aborted" = failed; module errors print inline.

short_description: Metasploit Framework — exploit execution (runs immediately, no gate)
category: exploitation
wstg_ids:
  - WSTG-INPV-11
mitre_attack:
  - T1190
safety_class: destructive

parameters:
  - name: command
    type: string
    description: |
      msfconsole command string (e.g. "use auxiliary/scanner/http/http_version;
      set RHOSTS 10.0.0.5; run"). Do NOT append "exit" — added automatically
      (suffix "; exit"). Prefer auxiliary modules; exploit/ modules only
      for confirmed vulns.
    required: true
    flag: "-x"
    suffix: "; exit"
  - name: quiet
    type: bool
    description: Quiet mode (no banner)
    required: false
    flag: "-q"
    default: true
  - name: additional_args
    type: string
    description: Additional msfconsole arguments
    required: false
    default: ""

output:
  max_bytes: 50000
  format: text
  parse_hints:
    session_opened: 'Meterpreter session (\d+) opened'
    exploit_success: '(?i)exploit completed|session opened|command shell session'
    exploit_failed: '(?i)exploit aborted|expfailed|no session'

timeout: 180
allowed_exit_codes: [0, 1]