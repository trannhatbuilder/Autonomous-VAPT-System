# VAPT-AI MCP Tool Wrapper — nmap
# ============================================================
# Tool: nmap (Network Mapper)
# Category: network_scanner
# WSTG IDs: WSTG-INFO-02 (TCP/IP Fingerprinting), WSTG-INFO-03 (Port Scan)
# MITRE ATT&CK: T1046 (Network Service Discovery)
# Install: apt install nmap (W1-I)
# ============================================================

name: nmap
command: nmap
enabled: true
description: |
  Network scanner — discovers hosts + services on a network, OS detection,
  version detection, script scanning (NSE). Use for port scanning, service
  fingerprinting, vulnerability detection via NSE scripts.

  Examples:
    - Port scan top 1000 ports: nmap target -sT -sV -Pn
    - Full port scan:           nmap target -sT -Pn -p-
    - OS + version detection:   nmap target -A -Pn (root required)
    - NSE vuln scripts:         nmap target -Pn --script vuln

  NOTE: Most hardened/WAF-fronted targets drop ICMP ping probes. The
  default host_online=true (-Pn) treats the host as up without pinging —
  keep it enabled unless you are scanning a large CIDR and need host
  discovery. "Host seems down" in output almost always means the ping
  was blocked, NOT that the host is dead.

short_description: Network scanner — port scan, service detection, NSE scripts

# Tool category for organization + UI grouping
category: network_scanner

# Standards mapping
wstg_ids:
  - WSTG-INFO-02  # TCP/IP Fingerprinting
  - WSTG-INFO-03  # Port Scan
mitre_attack:
  - T1046  # Network Service Discovery

# Safety classification — drives HITL gate (D25)
# passive: no impact on target (read-only)
# active: sends probes but no exploitation
# destructive: exploitation (HITL required)
safety_class: active

# Parameters schema (JSON Schema format — MCP compatible)
parameters:
  - name: target
    type: string
    description: Target IP, hostname, or CIDR range (e.g. 192.168.1.1, scanme.nmap.org, 10.0.0.0/24)
    required: true
    position: 1  # positional arg (appended to command)

  # FIX: added — THE critical default for WAF-fronted/hardened targets
  # that drop ICMP. Without -Pn, single-target scans frequently return
  # "Host seems down" and waste an iteration before the agent self-corrects.
  - name: host_online
    type: bool
    description: |
      Treat host as always online (-Pn), skipping ping discovery.
      Default true — most targets block ICMP and would otherwise be
      reported as "down". Disable ONLY when scanning large CIDR ranges
      where host discovery is the goal.
    required: false
    flag: "-Pn"
    default: true

  - name: ports
    type: string
    description: |
      Port specification via -p (e.g. "80", "1-1000", "80,443,8080").
      For ALL 65535 ports use additional_args="-p-" (nmap requires the
      literal "-p-" token; "-p -" is not valid).
    required: false
    flag: "-p"
    default: ""

  - name: scan_type
    type: string
    description: |
      Scan technique flag (e.g. -sT, -sS, -sU, -sA).
      DEFAULT is -sT (TCP connect scan — does NOT require root).
      Use -sS only when running as root (requires CAP_NET_RAW).
      This value is appended DIRECTLY to the nmap command — it is both
      the flag and the value.
    required: false
    # NOTE: NO `flag:` field — scan_type IS itself a flag (e.g. "-sT").
    # If we set flag="-sS" + value="-sT", the loader would emit
    # "nmap -sS -sT ..." which causes "You requested a scan type which
    # requires root privileges" because nmap sees the -sS flag.
    # Using position makes the loader append JUST the value as-is.
    position: 2  # appended after target (position 1)
    default: "-sT"  # TCP connect scan — no root needed (W19-FIX3-F3: fast mode default)
    options:
      - "-sT"  # TCP connect scan (no root) ← DEFAULT, safe under systemd
      - "-sS"  # SYN scan (stealth) — requires root/CAP_NET_RAW
      - "-sU"  # UDP scan — requires root
      - "-sA"  # ACK scan (firewall detection) — requires root

  # W19-FIX3-F3: version_detection + os_detection default = true (fast profile
  # needs both for accurate service fingerprinting). aggressive stays false —
  # -A is too deep for default pentest web-app scans (slow + noisy).
  - name: version_detection
    type: bool
    description: Enable service version detection (-sV). Default true (fast mode).
    required: false
    flag: "-sV"
    default: true

  - name: os_detection
    type: bool
    description: |
      Enable OS detection (-O). Default FALSE — requires root privileges.
      The agent runs as non-root, so -O will cause nmap to quit with error.
      Only enable if running as root (sudo).
    required: false
    flag: "-O"
    default: false

  - name: aggressive
    type: bool
    description: |
      Enable aggressive scan (-A = OS + version + script + traceroute).
      Default FALSE — too deep + slow for default pentest web-app scans.
      For full aggressive scan, set aggressive=true AND override
      additional_args="-p-" to scan all 65535 ports (per W19-FIX3-F3 nmap_full).
    required: false
    flag: "-A"
    default: false

  # FIX: added — filters output to open ports only, reduces noise and
  # keeps output under max_bytes on busy hosts
  - name: open_only
    type: bool
    description: Only show open (or possibly open) ports (--open)
    required: false
    flag: "--open"
    default: true

  - name: script
    type: string
    description: NSE script to run (e.g. vuln, banner, smb-os-discovery)
    required: false
    flag: "--script"
    default: ""

  - name: timing
    type: string
    description: |
      Timing template (T0=paranoid, T3=normal, T4=aggressive, T5=insane).
      T4 default. For WAF-fronted targets consider T3 to reduce
      rate-limit/ban risk.
    required: false
    flag: "-T"
    default: "4"
    options: ["0", "1", "2", "3", "4", "5"]

  # ---- hang guards -------------------------------------------------------
  # Without these, a slow/filtered host or a heavy NSE script (http-enum,
  # ssl-cert, vuln) can keep nmap running until the wrapper's hard timeout,
  # which stalls the whole scan with no UI feedback. These let nmap give up
  # on its own and return PARTIAL results instead of being SIGKILLed.
  - name: host_timeout
    type: string
    description: |
      Give up on the target after this long (e.g. 120s, 4m). Bounds a slow or
      filtered host. Default 4m. nmap returns whatever it found so far.
    required: false
    flag: "--host-timeout"
    default: "4m"

  - name: script_timeout
    type: string
    description: |
      Per-NSE-script timeout (e.g. 60s). http-enum / ssl-cert / vuln scripts can
      otherwise run for many minutes each. Default 60s.
    required: false
    flag: "--script-timeout"
    default: "60s"

  - name: additional_args
    type: string
    description: |
      Additional nmap arguments. Default under fast profile: "--top-ports 1000
      --version-intensity 5" (per W19-FIX3-F3). Override with "-p-" for full
      range or any other nmap flags.
    required: false
    default: "--top-ports 1000 --version-intensity 5"  # W19-FIX3-F3 fast-mode default

# Output handling
output:
  max_bytes: 50000  # 50KB cap, spill to disk if exceeded
  format: text       # nmap outputs text by default
  # FIX: single-escaped (no double backslashes) + leading \s* so that
  # indented nmap lines ("   80/tcp   open  http") actually match.
  parse_hints:
    open_port: '^\s*(\d+)/(tcp|udp)\s+open\s+(\S+)'
    host_status: 'Host is up|Host:\s+\S+\s+\(.*\)\s+Status: Up'
    os_guess: '^OS details: (.*)'
    filtered_note: 'Host seems down.*try -Pn'

# Timeout (seconds) — hard external bound.
# nmap self-terminates earlier via --host-timeout (default 4m); this is the
# backstop if nmap ignores it or hangs. Kept well below the old 600s so the
# scan cannot appear "frozen" for 10 minutes.
timeout: 300

# FIX: was [0, 1] with wrong comment. nmap exits 0 even when NO hosts are
# up ("Host seems down" is still a successful run). Exit 1 = real error
# (DNS resolution failure, bad flag, privilege error). Allowing exit 1
# here would silently swallow invocation errors — the orchestrator must
# see them so the agent can self-correct.
allowed_exit_codes: [0]