# VAPT-AI MCP Tool Wrapper — feroxbuster
# ============================================================
# Tool: feroxbuster (Recursive content discovery)
# Category: web_scanner
# WSTG IDs: WSTG-CONF-05 (Review Old Backup and Unreferenced Files)
# MITRE ATT&CK: T1595.003 (Wordlist Scanning)
# Install: apt install feroxbuster (W1-I) or cargo install feroxbuster
# ============================================================

name: feroxbuster
command: feroxbuster
enabled: true
description: |
  Fast recursive content discovery tool. Combines speed of ffuf with
  recursion of gobuster. Auto-discovers + recurses into found directories.

  Examples:
    - Basic scan: feroxbuster -u <url>
    - With extensions: feroxbuster -u <url> -x php,html,txt
    - Custom wordlist: feroxbuster -u <url> -w wordlist.txt
    - Filter status: feroxbuster -u <url> -C 404,403

short_description: Recursive content discovery (fast + auto-recurse)

category: web_scanner

wstg_ids:
  - WSTG-CONF-05  # Old Backup and Unreferenced Files
mitre_attack:
  - T1595.003  # Wordlist Scanning

safety_class: active

parameters:
  - name: target
    type: string
    description: Target URL
    required: true
    flag: "-u"

  # W23-FIX: added. Without -k, feroxbuster aborts HTTPS scans against
  # CDN/WAF-fronted hosts (Cloudflare, Akamai, fastly) and self-signed certs
  # with "Could not connect" / cert-verify errors, producing ZERO findings.
  # VERIFIED: `-k, --insecure` exists in feroxbuster 2.13.1 (help output).
  # Default ON: agent scans are reconnaissance against untrusted targets where
  # a broken/observed cert chain must NOT abort the scan. Set false only when
  # strict cert validation is explicitly required.
  - name: insecure_tls
    type: bool
    description: |
      Skip TLS certificate verification (-k). KEEP ON for CDN/WAF-fronted
      HTTPS targets (Cloudflare, Akamai) and self-signed certs — otherwise
      feroxbuster fails with "Could not connect" and returns no results.
    required: false
    flag: "-k"
    default: true

  - name: wordlist
    type: string
    description: |
      Path to wordlist file. W19-FIX3-F3: default medium wordlist (NOT large)
      — balances coverage vs scan time. Override with directory-list-2.3-big
      or directory-list-2.3-large for deeper enumeration when explicitly needed.
      Empty string → use feroxbuster's built-in wordlist (still medium-sized).
    required: false
    flag: "-w"
    default: "/usr/share/wordlists/dirb/directory-list-2.3-medium.txt"

  - name: extensions
    type: string
    description: File extensions (comma-separated, e.g. php,asp,jsp)
    required: false
    flag: "-x"
    default: ""

  - name: depth
    type: integer
    description: Maximum recursion depth
    required: false
    flag: "-d"
    default: 4

  - name: threads
    type: integer
    description: Number of concurrent threads
    required: false
    flag: "-t"
    default: 50

  - name: filter_status
    type: string
    description: Filter OUT these status codes (comma-separated, e.g. 404,403)
    required: false
    flag: "-C"
    default: ""

  - name: timeout
    type: integer
    description: HTTP timeout (seconds)
    required: false
    flag: "-T"
    default: 10

  - name: additional_args
    type: string
    description: Additional feroxbuster arguments
    required: false
    default: ""

output:
  max_bytes: 50000
  format: text
  parse_hints:
    found: '^(\d{3})\s+(\S+)\s+(\S+)\s+(\d+\w+)'

timeout: 300  # 5 min (was 900s/15min — too long for single-host scan)
allowed_exit_codes: [0, 1]