# VAPT-AI MCP Tool Wrapper — sqlmap
# ============================================================
# Tool: sqlmap (SQL injection detection + exploitation)
# Category: web_scanner
# WSTG IDs: WSTG-INPV-05 (Testing for SQL Injection)
# MITRE ATT&CK: T1190 (Exploit Public-Facing Application)
# Install: apt install sqlmap + pip install sqlmap (W1-I)
# ============================================================
# D25 HITL POLICY (WIDENED — dump/os-shell now ENABLED):
#   - detect:  --batch only.
#   - dump:    --dump / -D / -T (first-class params) — extract data as PoC.
#   - exploit: --os-shell / --sql-shell (via additional_args) — final-proof
#              escalation only.
#   - blocked: ONLY --os-pwn and --priv-esc (see `forbidden_args` below),
#              enforced in tool_bridge.execute_tool_call (NOT scope_guard,
#              which is permissive in this deploy).
# HITL is DISABLED in this deployment, so these flags run WITHOUT a human gate.
# The agent is instructed to escalate gradually (detect -> dump -> os-shell)
# and to treat --os-shell as a last resort.
# ============================================================

name: sqlmap
command: sqlmap
enabled: true
description: |
  SQL injection detection + exploitation. Full capability: detect, enumerate,
  and dump database content as PoC. sqlmap output (injection point + payload
  + DBMS + dumped rows) IS the strongest PoC for SQLi findings.

  Workflow (escalate gradually):
    1. Detect:        sqlmap -u <url> --batch
    2. Confirm data:  sqlmap -u <url> -p <param> --batch --dump -D <db> -T <table>
    3. Only if needed: --os-shell (RCE — use as final proof, document impact).
       Pass --os-shell / --sql-shell through additional_args (no dedicated param).

  Tips: --random-agent is ON by default (WAF). If blocked, add
  --tamper=space2comment via additional_args. Use -p to target one param
  instead of full-URL scans (much faster). Prefer -D/-T with --dump to avoid
  dumping every DBMS table (slow — may exhaust the tool timeout).

short_description: SQL injection detection + data dump (PoC extraction; escalate gradually)

category: web_scanner

wstg_ids:
  - WSTG-INPV-05  # Testing for SQL Injection
mitre_attack:
  - T1190  # Exploit Public-Facing Application

safety_class: destructive  # now includes --dump / --os-shell escalation

parameters:
  - name: target
    type: string
    description: Target URL with parameters (e.g. http://example.com/page?id=1)
    required: true
    flag: "-u"

  - name: data
    type: string
    description: POST data string (e.g. "user=admin&pass=test")
    required: false
    flag: "--data"
    default: ""

  - name: param
    type: string
    description: Specific parameter to test (skip others). Comma-separated for multiple.
    required: false
    flag: "-p"
    default: ""

  - name: cookie
    type: string
    description: HTTP Cookie header value
    required: false
    flag: "--cookie"
    default: ""

  - name: method
    type: string
    description: |
      HTTP method (GET, POST, PUT, DELETE). Default empty — sqlmap infers the
      method from the URL (GET) or --data (POST). Only set to force a method.
    required: false
    flag: "--method"
    default: ""
    options: ["", "GET", "POST", "PUT", "DELETE", "PATCH"]

  - name: level
    type: integer
    description: |
      Test level (1-5, higher = more tests but slower).
      W19-FIX3-F3: default 1 (safe + fast) — NOT --level 5. Use higher levels
      only when explicitly requested for targeted deep testing.
    required: false
    flag: "--level"
    default: 1
    options: [1, 2, 3, 4, 5]

  - name: risk
    type: integer
    description: |
      Risk of tests (1-3, higher = more aggressive — risk of data modification).
      W19-FIX3-F3: default 1 (safe). Risk 2-3 can modify DB rows — use only with
      explicit user opt-in via additional_args.
    required: false
    flag: "--risk"
    default: 1
    options: [1, 2, 3]

  - name: dbms
    type: string
    description: Target DBMS (mysql, postgresql, mssql, oracle, sqlite, etc.)
    required: false
    flag: "--dbms"
    default: ""

  - name: batch
    type: bool
    description: |
      Never ask for user input (use defaults). W19-FIX3-F3: MUST stay true
      for agent-driven scans — sqlmap's interactive prompts would block the
      agent loop indefinitely.
    required: false
    flag: "--batch"
    default: true

  # FIX: added — sqlmap's default UA is instantly blocked by Cloudflare/WAF
  # (agent previously had to hack this via additional_args)
  - name: random_agent
    type: bool
    description: Use a random User-Agent (--random-agent). ALWAYS enable for WAF-fronted targets.
    required: false
    flag: "--random-agent"
    default: true

  # FIX: added — per-request timeout; keeps slow/WAF targets from stalling
  - name: timeout
    type: integer
    description: HTTP request timeout in seconds (--timeout)
    required: false
    flag: "--timeout"
    default: 20

  - name: threads
    type: integer
    description: Concurrency (default 1 — raise to 4 for faster tests on confirmed targets)
    required: false
    flag: "--threads"
    default: 1

  # WIDENED (was hard-blocked): --dump is now a first-class param. Scope the
  # extraction with dump_db (-D) / dump_table (-T); a bare --dump enumerates
  # ALL tables of ALL databases and can exhaust the 300s tool timeout.
  - name: dump
    type: bool
    description: |
      Extract DB entries for the tested parameter (--dump) — the PoC for SQLi
      impact. Combine with dump_db (-D) and dump_table (-T) to avoid dumping
      the entire DBMS (slow; may hit the 300s timeout).
    required: false
    flag: "--dump"
    default: false

  - name: dump_db
    type: string
    description: "Target database for --dump -D (e.g. dvwa). Empty = all databases."
    required: false
    flag: "-D"
    default: ""

  - name: dump_table
    type: string
    description: "Target table for --dump -T (e.g. users). Empty = all tables of the selected DB."
    required: false
    flag: "-T"
    default: ""

  - name: additional_args
    type: string
    description: |
      Additional sqlmap arguments (e.g. --tamper=space2comment, --os-shell,
      --sql-shell). ONLY --os-pwn and --priv-esc are hard-blocked by
      tool_bridge (forbidden_args).
    required: false
    default: ""

output:
  max_bytes: 50000
  format: text
  parse_hints:
    sqli_found: "(.*)(is vulnerable|injectable)(.*)"
    dbms: "back-end DBMS: (.*)"
    payload: "Payload: (.*)"

# FIX: 600 -> 300. sqlmap has no total run-time bound; with tamper scripts the
# request count multiplies and a 10-minute run still never finishes. 300s is
# enough for a single-parameter test; past that the agent should narrow scope
# (e.g. -p <specific-param>) instead of waiting.
timeout: 300
allowed_exit_codes: [0, 1]  # 1 = no SQLi found — still useful

# Only the most dangerous flags remain blocked — enforced in
# app/agents/tool_bridge.py (execute_tool_call), NOT by scope_guard.
# --dump / --dump-all / --os-shell / --sql-shell are intentionally ALLOWED now.
forbidden_args:
  - "--os-pwn"    # out-of-band shell (Meterpreter/VNC) — not needed
  - "--priv-esc"  # DB process privilege escalation — not needed
