[pytest]
# VAPT-AI test configuration.
# Legacy EVVO tests (tests/test_*.py at root) use the local async fallback
# in tests/conftest.py. VAPT-AI tests (tests/vapt/) use pytest-asyncio.
#
# Run only VAPT-AI tests:
#   pytest tests/vapt/ -v
#
# Run all tests (EVVO + VAPT-AI):
#   pytest -v

markers =
    asyncio: run async tests with pytest-asyncio

# Auto-detect async tests (pytest-asyncio auto mode)
asyncio_mode = auto

# Test discovery
testpaths = tests

# Minimum coverage threshold (run with --cov=app to enforce)
# addopts = --cov=app --cov-report=term-missing --cov-fail-under=80

# Ignore warnings from legacy EVVO tests (they use deprecated APIs)
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
